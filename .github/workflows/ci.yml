name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Скрипты вне TypeScript: Electron, MCP, сборщик словарей — хотя бы синтаксис.
      - run: for f in electron/main.cjs electron/preload.cjs mcp/server.mjs scripts/build-dict.mjs; do node --check "$f"; done
